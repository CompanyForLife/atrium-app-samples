<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Node configuration</title>
  <link rel="stylesheet" href="/assets/atrium.css">
</head>
<body class="at-app">
  <main class="at-stack">
    <header class="at-header"><h1 class="at-header__title">Hello Node configuration</h1></header>
    <section class="at-card at-stack">
      <h2 class="at-card__title">App-owned settings</h2>
      <p>This is the app-owned external configuration surface, opened in a new tab.</p>
      <p>The sample keeps organisation settings in COHO's native JSON Schema form. A production app could authenticate its own users here and offer richer settings.</p>
      <p class="at-small at-muted">Runtime: Node http.</p>
    </section>
  </main>
  <script>
    var theme = new URLSearchParams(location.search).get('theme');
    if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-color-mode', theme);
  </script>
</body>
</html>
