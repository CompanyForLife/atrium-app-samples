<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Node configuration</title>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/design/coho.css">
</head>
<body>
  <main class="u-padding-left--20 u-padding-right--20">
    <h1 class="heading--1 u-margin-top--20 u-margin-bottom--20">Hello Node configuration</h1>

    <section class="page__section page__section--narrow">
      <div class="heading--section">
        <h2 class="heading--2">App-owned settings</h2>
      </div>
      <p>This is the app-owned external configuration surface, opened in a new tab.</p>
      <p>The sample keeps organisation settings in COHO's native JSON Schema form. A production app could authenticate its own users here and offer richer settings.</p>
      <p class="u-text--small u-text-color--grey">Runtime: Node http.</p>
    </section>
  </main>
  <script>
    // External page, opened in a new tab: the signed URL names the theme and there is no COHO parent to post updates.
    function applyTheme(theme) {
      var next = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      document.body.classList.toggle('coho__dark', next === 'dark');
    }
    var fromQuery = new URLSearchParams(location.search).get('theme');
    if (fromQuery === 'dark' || fromQuery === 'light') applyTheme(fromQuery);
  </script>
</body>
</html>
